name: factory-erp

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factory_erp}
      POSTGRES_USER: ${POSTGRES_USER:-factory_erp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      TZ: ${DEFAULT_TIMEZONE:-Europe/Istanbul}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data

  migrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrator
    image: ${APP_IMAGE_REPOSITORY:-factory-erp}/migrator:${APP_IMAGE_TAG:-local}
    profiles: ["migration"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-factory_erp};Username=${POSTGRES_USER:-factory_erp_app};Password=${POSTGRES_PASSWORD}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME for the migration job}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD for the migration job}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  backup-role-bootstrap:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: ${APP_IMAGE_REPOSITORY:-factory-erp}/backup:${APP_IMAGE_TAG:-local}
    profiles: ["backup-setup"]
    restart: "no"
    entrypoint: ["/usr/local/bin/factory-erp-bootstrap-backup-role"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:-factory_erp_app}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ROLE: ${BACKUP_ROLE:-factory_erp_backup}
      BACKUP_ROLE_PASSWORD: ${BACKUP_ROLE_PASSWORD:?Set BACKUP_ROLE_PASSWORD for backup jobs}
      TARGET_DATABASE: ${POSTGRES_DB:-factory_erp}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  backup-volume-init:
    image: alpine:3.20
    profiles: ["backup"]
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/backups/factory-erp && chown 999:999 /var/backups/factory-erp && chmod 0700 /var/backups/factory-erp"]
    volumes:
      - backup_data:/var/backups/factory-erp
    networks:
      - backup

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: ${APP_IMAGE_REPOSITORY:-factory-erp}/backup:${APP_IMAGE_TAG:-local}
    profiles: ["backup"]
    restart: "no"
    entrypoint: ["/usr/local/bin/factory-erp-backup"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-factory_erp}
      PGUSER: ${BACKUP_ROLE:-factory_erp_backup}
      PGPASSWORD: ${BACKUP_ROLE_PASSWORD}
      BACKUP_ROOT: /var/backups/factory-erp
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-factory_erp}
    volumes:
      - backup_data:/var/backups/factory-erp
    depends_on:
      postgres:
        condition: service_healthy
      backup-volume-init:
        condition: service_completed_successfully
    networks:
      - data
      - backup

  restore-role-bootstrap:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: ${APP_IMAGE_REPOSITORY:-factory-erp}/backup:${APP_IMAGE_TAG:-local}
    profiles: ["restore"]
    restart: "no"
    entrypoint: ["/usr/local/bin/factory-erp-bootstrap-restore-role"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:-factory_erp_app}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RESTORE_ROLE: ${RESTORE_ROLE:-factory_erp_restore}
      RESTORE_ROLE_PASSWORD: ${RESTORE_ROLE_PASSWORD:?Set RESTORE_ROLE_PASSWORD for restore smoke jobs}
      TARGET_DATABASE: ${POSTGRES_DB:-factory_erp}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  restore-smoke:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: ${APP_IMAGE_REPOSITORY:-factory-erp}/backup:${APP_IMAGE_TAG:-local}
    profiles: ["restore"]
    restart: "no"
    entrypoint: ["/usr/local/bin/factory-erp-restore-smoke"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-factory_erp}
      PGUSER: ${RESTORE_ROLE:-factory_erp_restore}
      PGPASSWORD: ${RESTORE_ROLE_PASSWORD}
      SOURCE_DATABASE: ${POSTGRES_DB:-factory_erp}
      BACKUP_FILE: ${BACKUP_FILE:-/var/backups/factory-erp/latest.dump}
      RESTORE_DATABASE: ${RESTORE_DATABASE:-factory_erp_restore_smoke}
    volumes:
      - backup_data:/var/backups/factory-erp:ro
    depends_on:
      postgres:
        condition: service_healthy
      restore-role-bootstrap:
        condition: service_completed_successfully
    networks:
      - data
      - backup

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    image: ${APP_IMAGE_REPOSITORY:-factory-erp}/api:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__FactoryErp: Host=postgres;Port=5432;Database=${POSTGRES_DB:-factory_erp};Username=${POSTGRES_USER:-factory_erp_app};Password=${POSTGRES_PASSWORD}
      Authentication__Issuer: ${JWT_ISSUER:?Set JWT_ISSUER in the deployment environment}
      Authentication__Audience: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in the deployment environment}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in the deployment environment}
      Authentication__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      Authentication__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 12
    networks:
      - internal
      - data

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
      - internal

volumes:
  postgres_data:
  backup_data:

networks:
  edge:
    internal: false
  internal:
    internal: true
  data:
    internal: true
  backup:
    internal: true

name: Domain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  domain-quality-gate:
    name: Domain quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FactoryErp.sln

      - name: Build Release
        run: dotnet build FactoryErp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FactoryErp.sln --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
